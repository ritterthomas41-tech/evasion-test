<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spoonbreak</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070606; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; background: #070606; }
    /* 28/11 (SA demande : « une petite image au chargement ») : la miniature, en entier, et la barre par-dessus en bas */
    #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 7vh; box-sizing: border-box;
                  background: #070606 url('chargement.jpg') center top / cover no-repeat; color: #efe7dc; font: 700 16px system-ui, sans-serif; letter-spacing: .04em; }
    #chargement span { background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 6px; margin-bottom: 10px; }
    #barre { width: min(60vw, 420px); height: 12px; background: rgba(20,16,14,.85); border: 2px solid #4a2a10; border-radius: 8px; overflow: hidden; }
    #barre i { display: block; height: 100%; width: 0; background: #d9a514; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
  <!-- 23/11 : le kit CrazyGames (SDK v3). Hors de CrazyGames et de localhost il est « disabled » : le jeu ne l'appelle pas. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="chargement"><span>LOADING...</span><div id="barre"><i></i></div></div>
  <script src="Build/e396197d6fb0f32fd5e0498b54074616.loader.js"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    // 23/11 : le kit CrazyGames s'initialise AVANT le jeu (la sauvegarde lit son module de donnees des le lancement).
    // Bloque par un bloqueur de pub, absent ou trop lent (8 s) : le jeu demarre quand meme, et il le guette encore 30 s (CrazyGames.cs).
    window.__cg = { pret: false, env: 'aucun' };
    function cgInit() {
      try {
        if (!window.CrazyGames || !window.CrazyGames.SDK) return Promise.resolve();
        var init = window.CrazyGames.SDK.init().then(function () {
          window.__cg.env = window.CrazyGames.SDK.environment;
          window.__cg.pret = window.__cg.env === 'local' || window.__cg.env === 'crazygames';
          if (window.__cg.pret) window.CrazyGames.SDK.game.loadingStart();
        }).catch(function (e) { console.log('[cg] init : ' + (e && e.message)); });
        return Promise.race([init, new Promise(function (ok) { setTimeout(ok, 8000); })]);
      } catch (e) { return Promise.resolve(); }
    }
    cgInit().then(function () { return createUnityInstance(canvas, {
      dataUrl: 'Build/effd7a68c9ca218e33a7518b57dcb202.data.unityweb',
      frameworkUrl: 'Build/adea14720bf5e1f82005de9f1d527fdb.framework.js.unityweb',
      codeUrl: 'Build/fd2648f4646d7d57f230527b64765561.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Game and Disc",
      productName: "L'Evasion",
      productVersion: "27/11 12:39",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) ? 1.5 : 2),   // 22/11 : 1,5 sur telephone (fluidite)
    }, p => { document.querySelector('#barre i').style.width = (100 * p) + '%'; }); })
    .then(() => { document.querySelector('#chargement').remove(); canvas.focus(); })
    .catch(m => { document.querySelector('#chargement span').textContent = m; });
  </script>
</body>
</html>
