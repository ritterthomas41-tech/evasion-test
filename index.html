<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spoonbreak</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070606; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; background: #070606; }
    /* 28/11 (SA demande : « une petite image au chargement ») : la miniature, en entier, et la barre par-dessus en bas */
    #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
                  background: #070606;   /* 28/11 (SA demande : « retire l image de derriere, ca fait cheap ») : fond uni ; chargement.jpg reste dans le dossier */
                  color: #efe7dc; font: 700 16px system-ui, sans-serif; letter-spacing: .04em; }
    #anim { image-rendering: pixelated; margin-bottom: 14px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)); }   /* 28/11 : la cuillere qui tape un bloc */
    #chargement span { background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 6px; margin-bottom: 10px; }
    /* 28/11 (SA demande) : la barre EN BLOCS : 14 cases qui se remplissent d un bloc de brique, une par une, avec un petit « pop » */
    #barre { display: flex; gap: min(4px, .6vw); }
    #barre b { width: min(26px, 4.6vw); height: min(26px, 4.6vw); box-sizing: border-box; background: #1b1714; border: 2px solid #000; box-shadow: inset 2px 2px 0 rgba(255,255,255,.07), inset -2px -2px 0 rgba(0,0,0,.55); image-rendering: pixelated; }
    #barre b.plein { background: #5a3d22 var(--bloc) center / 178% no-repeat; animation: pop .25s ease-out; }
    @keyframes pop { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
    /* et une ASTUCE qui change toutes les 3,5 s */
    #astuce { margin-top: 14px; min-height: 20px; padding: 0 16px; color: #c9bfb2; font: 600 15px system-ui, sans-serif; letter-spacing: .02em; text-align: center; transition: opacity .35s; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* 28/11 (SA demande : « desactive le mode portrait sur mobile ») : au doigt et en portrait, un ecran « tourne ton telephone » */
    #tourne { display: none; position: fixed; inset: 0; z-index: 20; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
              background: rgba(7,6,6,.93); color: #ffd23f; font: 800 22px system-ui, sans-serif; text-align: center; letter-spacing: .04em; padding: 24px; box-sizing: border-box; }
    #tourne .tel { width: 54px; height: 92px; border: 5px solid #ffd23f; border-radius: 10px; animation: tourne 1.6s ease-in-out infinite; }
    #tourne small { color: #efe7dc; font-weight: 600; font-size: 15px; }
    @keyframes tourne { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #tourne { display: flex; } }
  </style>
  <!-- 23/11 : le kit CrazyGames (SDK v3). Hors de CrazyGames et de localhost il est « disabled » : le jeu ne l'appelle pas. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="tourne"><div class="tel"></div><div>ROTATE YOUR PHONE</div><small>Spoonbreak is played in landscape</small></div>
  <script>
    // et quand le navigateur le permet (plein ecran, Android), on verrouille l ecran en paysage au premier toucher
    document.addEventListener('touchend', function () { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} }, { once: true });
  </script>
